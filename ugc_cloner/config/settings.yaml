amazon:
  access_key: ''
  secret_key: ''
  partner_tag: test-20
  region: us-east-1
  min_commission_pct: 3.0
  categories:
  - Electronics
  - Beauty
  - Health
  - Kitchen
  - Toys
  - Sports
  best_seller_pages: 3
tiktok:
  client_key: ''
  client_secret: ''
  access_token: ''
  session_id: ''
  viral_hashtags:
  - tiktokmademebuyit
  - amazonfinds
  - productreview
  - ugc
  - affiliatemarketing
  min_views_viral: 100000
generation:
  batch_size: 50
  video_split: 0.6
  video_duration_sec: 30
  resolution:
    width: 1080
    height: 1920
  fps: 30
  videos_per_product: 5
  tts_engine: gtts
  tts_language: en
  tts_speed: 1.15
  use_stable_diffusion: false
  sd_api_url: http://127.0.0.1:7860
hooks:
  openers:
  - 'POV: You just found the best {category} product on Amazon'
  - I can't believe this {product} exists and it's only ${price}
  - This {product} changed my life and I'm not exaggerating
  - Amazon finds that feel illegal to know about
  - "Stop scrolling \u2014 you NEED to see this {product}"
  - I've been sleeping on this {product} for too long
  - "The {product} everyone is talking about \u2014 worth it?"
  - Rating viral TikTok {category} products so you don't have to
  ctas:
  - "Link in bio \u2014 affiliate commission helps support this channel"
  - I'll put the link in my bio, it's literally {discount}% off right now
  - "Grab it before this deal ends \u2014 link in bio"
  - Check my bio for the direct link to save you time
scheduler:
  platforms:
  - tiktok
  posts_per_day: 4
  posting_times:
  - 07:00
  - '12:00'
  - '17:00'
  - '21:00'
  timezone: America/New_York
  campaign_days: 60
instagram:
  username: ''
  password: ''
  session_file: output/.instagram_session.json
youtube:
  credentials_file: config/youtube_credentials.json
  channel_id: ''
output:
  base_dir: output
  videos_dir: output/videos
  slideshows_dir: output/slideshows
  images_dir: output/images
  audio_dir: output/audio
  keep_intermediates: false
logging:
  level: INFO
  file: output/ugc_cloner.log
